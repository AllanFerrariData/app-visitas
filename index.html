<style>

.sw .tx{flex:1}
.sw b{display:block;font-size:16px}
.sw small{color:var(--muted);font-size:13px}
.sw .tg{width:52px;height:32px;border-radius:999px;background:#C3CFD0;position:relative;flex:none;transition:background .15s}
.sw .tg::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on .tg{background:var(--dark)}
.sw.on .tg::after{left:24px}
.two{display:flex;gap:10px}.two>*{flex:1}
.counter{display:flex;align-items:center;justify-content:center;gap:22px;padding:8px 0}
.counter b{font-size:64px;color:var(--num);min-width:96px;text-align:center}
.round{width:64px;height:64px;border-radius:50%;border:2px solid var(--dark);background:#fff;color:var(--dark);font-size:32px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);background:#16282A;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:50}
#toast.show{opacity:1}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ====== Configuração ====== */
const PRECO_PLACA = 49.90; // preço praticado (planilha, aba Preço e margem)
const STATUS = {
  'Aguardando resultado': { curto: 'Aguardando', cls: 'p-ag', desc: 'Sem resposta ainda' },
  'Agendado': { curto: 'Agendado', cls: 'p-agd', desc: 'Conversar em outra data' },
  'Vendido': { curto: 'Vendido', cls: 'p-v', desc: 'Venda fechada' },
  'Não apto': { curto: 'Não apto', cls: 'p-na', desc: 'Não compensa voltar' }
};
const ORDEM_STATUS = Object.keys(STATUS);

/* ====== Ícones ====== */
const I = {
  back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  eye: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  eraser: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21h11"/><path d="M5.5 13.5l7-7a2 2 0 0 1 2.8 0l3 3a2 2 0 0 1 0 2.8L11 20H7.8a2 2 0 0 1-1.4-.6l-.9-.9a2 2 0 0 1 0-2.9z"/><path d="M8.5 10.5l5 5"/></svg>',
  down: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7A4B00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  up: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7A4B00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  plus: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
  list: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/></svg>',
  nfc: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 8.5a5 5 0 0 1 0 7"/><path d="M9.5 6a9 9 0 0 1 0 12"/><path d="M13 3.5a13 13 0 0 1 0 17"/></svg>'
};

/* ====== Utilidades ====== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => dayKey(new Date());
const parseDay = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const shortDay = k => { if (!k) return ''; const d = parseDay(k); return DOW[d.getDay()] + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
function relDay(iso) {
  const d = new Date(iso), k = dayKey(d);
  const ont = new Date(); ont.setDate(ont.getDate() - 1);
  if (k === todayKey()) return 'Hoje';
  if (k === dayKey(ont)) return 'Ontem';
  return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + (d.getFullYear() !== new Date().getFullYear() ? '/' + d.getFullYear() : '');
}
const quando = iso => relDay(iso) + ' · ' + hhmm(new Date(iso));
function nextSaturdays(n) {
  const d = new Date(); d.setDate(d.getDate() + 1);
  while (d.getDay() !== 6) d.setDate(d.getDate() + 1);
  const out = [];
  for (let i = 0; i < n; i++) { out.push(dayKey(d)); d.setDate(d.getDate() + 7); }
  return out;
}
const minutosHorario = h => h === 'Manhã' ? 540 : h === 'Tarde' ? 840 : /^\d{2}:\d{2}$/.test(h || '') ? (+h.slice(0, 2)) * 60 + (+h.slice(3)) : 1440;
const brl = v => (v === '' || v == null || isNaN(v)) ? '' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num2 = v => (v === '' || v == null || isNaN(v)) ? '' : Number(v).toFixed(2).replace('.', ',');
const parseNum = s => { s = String(s == null ? '' : s).trim().replace(/\s|R\$/g, ''); if (!s) return ''; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return isNaN(n) ? '' : n; };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200); }

/* ====== Banco local (IndexedDB) ====== */
const db = {
  _p: null,
  open() {
    if (!this._p) this._p = new Promise((res, rej) => {
      const r = indexedDB.open('placas-nfc', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('registros', { keyPath: 'id' }); d.createObjectStore('metas', { keyPath: 'dia' }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._p;
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  put(store, v) { return this.tx(store, 'readwrite', s => s.put(v)); }
};
let REGS = [];
let METAS = {};
async function salvar(r, manterHora) {
  if (!manterHora) r.atualizadoEm = new Date().toISOString();
  r.pendenteEnvio = true;
  const i = REGS.findIndex(x => x.id === r.id);
  if (i >= 0) REGS[i] = r; else REGS.push(r);
  try { await db.put('registros', r); }
  catch (e) { toast('Erro ao salvar no celular: ' + e.message); throw e; }
}
const getReg = id => REGS.find(x => x.id === id);

/* ====== Localização ====== */
let ultimaPos = null;
function aquecerGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => { ultimaPos = p; }, () => {}, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}
function aplicarPos(r, p) {
  r.lat = +p.coords.latitude.toFixed(6); r.lng = +p.coords.longitude.toFixed(6); r.precisao = Math.round(p.coords.accuracy);
}
function capturarLocal(id, avisar) {
  if (!navigator.geolocation) { if (avisar) toast('Este navegador não fornece localização'); return; }
  navigator.geolocation.getCurrentPosition(async p => {
    const r = getReg(id); if (!r) return;
    aplicarPos(r, p); await salvar(r, true);
    if (avisar) toast('Localização salva');
    if (location.hash.includes(id)) rerender();
  }, err => {
    if (avisar) toast(err.code === 1 ? 'Localização bloqueada: permita nas configurações do site' : 'Não consegui a localização agora');
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}

/* ====== Navegação ====== */
const app = document.getElementById('app');
let D = {};             // rascunho do formulário da tela atual
let ultimaRota = null;
let oculto = true;      // olho: dados borrados no Início
let pendAberto = false;
const F = { status: 'Todos', opp: false, q: '' };
const estado = () => history.state || { d: 0 };
function go(h, replace) {
  const d = estado().d;
  if (replace) history.replaceState({ d }, '', h); else history.pushState({ d: d + 1 }, '', h);
  route();
}
function voltar() { if (estado().d > 0) history.back(); else go('#/', true); }
let querInicio = false;
function inicio() {
  const d = estado().d;
  if (d > 0) { querInicio = true; history.go(-d); } else go('#/', true);
}
window.addEventListener('popstate', () => {
  if (querInicio) { querInicio = false; if (location.hash && location.hash !== '#/') history.replaceState({ d: 0 }, '', '#/'); }
  route();
});
function rerender() { const m = app.querySelector('main'); const y = m ? m.scrollTop : 0; route(true); const m2 = app.querySelector('main'); if (m2) m2.scrollTop = y; }

function route(manter) {
  const h = location.hash || '#/';
  const [nome, id] = h.slice(2).split('/');
  if (!(manter && h === ultimaRota)) { D = iniciarRascunho(nome, id); }
  ultimaRota = h;
  const r = id ? getReg(id) : null;
  let html;
  if (id && !r && ['registro', 'editar', 'resultado', 'agendar'].includes(nome)) html = vNaoEncontrado();
  else switch (nome) {
    case 'nova': html = vDados(null); break;
    case 'editar': html = vDados(r); break;
    case 'agendar': html = vAgendar(r); break;
    case 'registro': html = vRegistro(r); break;
    case 'resultado': html = vResultado(r); break;
    case 'cadastro': html = vCadastro(); break;
    case 'meta': html = vMeta(); break;
    default: html = vInicio();
  }
  app.innerHTML = html;
  if (nome === 'cadastro') desenharLista();
  if (nome === 'nova' && !manter) aquecerGPS();
}

function iniciarRascunho(nome, id) {
  const r = id ? getReg(id) : null;
  if (nome === 'nova') return { estabelecimento: '', cidade: ls.get('ultimaCidade', 'Ponta Grossa'), atendeu: '', contato: '', telefone: '', email: '' };
  if (nome === 'editar' && r) return { estabelecimento: r.estabelecimento, cidade: r.cidade || '', atendeu: r.atendeu || '', contato: r.contato || '', telefone: r.telefone || '', email: r.email || '' };
  if ((nome === 'agendar' || nome === 'resultado') && r) {
    const sats = nextSaturdays(3);
    const h = r.horario || '';
    const x = {
      status: nome === 'agendar' ? 'Agendado' : r.status, oportunidade: !!r.oportunidade, comentario: r.comentario || '',
      dataAgendada: r.dataAgendada || '', falarCom: r.falarCom || '',
      horaTipo: (h === 'Manhã' || h === 'Tarde') ? h : (h ? 'Hora' : ''), hora: (h && h !== 'Manhã' && h !== 'Tarde') ? h : '',
      placas: r.placas === '' || r.placas == null ? '' : String(r.placas), valor: r.valor === '' || r.valor == null ? '' : num2(r.valor), valorAuto: false
    };
    if (nome === 'agendar' && !x.dataAgendada) x.dataAgendada = sats[0];
    x.outra = !!x.dataAgendada && !sats.includes(x.dataAgendada);
    return x;
  }
  if (nome === 'meta') return { meta: METAS[todayKey()] || 5 };
  return {};
}

/* ====== Peças de tela ====== */
function topo(titulo, sub) {
  return `<header class="top"><button class="ibtn" data-act="voltar" aria-label="Voltar">${I.back}</button><div class="grow"><h1>${esc(titulo)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div></header>`;
}
function abas(atual) {
  return `<nav class="tabs" aria-label="Navegação">
    <a href="#/" data-act="tabInicio" class="${atual === 'inicio' ? 'on' : ''}" ${atual === 'inicio' ? 'aria-current="page"' : ''}><span>${I.home}</span>Início</a>
    <a href="#/cadastro" data-act="tabCadastro" class="${atual === 'cadastro' ? 'on' : ''}" ${atual === 'cadastro' ? 'aria-current="page"' : ''}><span>${I.list}</span>Cadastro</a>
  </nav>`;
}
function campo(f, label, o) {
  o = o || {};
  return `<div class="field"><label for="f-${f}">${label}${o.opcional ? ' <span class="opt">(opcional)</span>' : ''}</label>
    <input id="f-${f}" data-f="${f}" type="${o.type || 'text'}" ${o.im ? `inputmode="${o.im}"` : ''} ${o.ac ? `autocomplete="${o.ac}"` : 'autocomplete="off"'} ${o.live ? `data-live="${o.live}"` : ''} ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} value="${esc(D[f])}"></div>`;
}
function chips(f, opcoes, alternar) {
  return `<div class="seg">${opcoes.map(([v, t]) => `<button type="button" class="chip${D[f] === v ? ' on' : ''}" data-act="set" data-f="${f}" data-v="${esc(v)}"${alternar ? ' data-toggle="1"' : ''} aria-pressed="${D[f] === v}">${esc(t || v)}</button>`).join('')}</div>`;
}
function pill(status) { const s = STATUS[status] || STATUS['Aguardando resultado']; return `<span class="pill ${s.cls}">${esc(s.curto)}</span>`; }
function quem(r) {
  if (r.contato && r.atendeu) return r.contato + ' (' + r.atendeu.toLowerCase() + ')';
  return r.contato || r.atendeu || '';
}
function blocoAgenda() {
  const sats = nextSaturdays(3);
  const dias = sats.map(k => `<button type="button" class="chip${!D.outra && D.dataAgendada === k ? ' on' : ''}" data-act="dia" data-v="${k}">${shortDay(k)}</button>`).join('')
    + `<button type="button" class="chip${D.outra ? ' on' : ''}" data-act="outra">Outra data</button>`;
  return `<div class="field"><span class="lab">Dia</span><div class="seg">${dias}</div>
      ${D.outra ? `<input type="date" data-f="dataAgendada" aria-label="Outra data" min="${todayKey()}" value="${esc(D.dataAgendada)}">` : ''}</div>
    <div class="field"><span class="lab">Horário <span class="opt">(opcional)</span></span>
      ${chips('horaTipo', [['Manhã'], ['Tarde'], ['Hora', 'Hora específica']], true)}
      ${D.horaTipo === 'Hora' ? `<input type="time" data-f="hora" aria-label="Hora" value="${esc(D.hora)}">` : ''}</div>`;
}
const horarioDoRascunho = () => D.horaTipo === 'Hora' ? (D.hora || '') : (D.horaTipo || '');

/* ====== Telas ====== */

        <button class="btn sec" data-act="exportar">Exportar planilha (CSV)</button></div>

function desenharLista() {
  const el = document.getElementById('lista'); if (!el) return;
  const q = norm(F.q);
  let list = REGS.filter(r => (F.status === 'Todos' || r.status === F.status) && (!F.opp || r.oportunidade));
  if (q) list = list.filter(r => norm([r.estabelecimento, r.contato, r.telefone, r.cidade, r.email, r.comentario, r.falarCom].join(' ')).includes(q) || (r.telefone || '').replace(/\D/g, '').includes(q.replace(/\D/g, '') || '§'));
  if (F.status === 'Agendado') list.sort((a, b) => (a.dataAgendada || '9999').localeCompare(b.dataAgendada || '9999') || minutosHorario(a.horario) - minutosHorario(b.horario));
  else list.sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
  if (!list.length) { el.innerHTML = `<div class="empty">${REGS.length ? 'Nenhum registro com esses filtros.' : 'Nenhuma visita ainda. Toque em Início → Nova visita.'}</div>`; return; }
  el.innerHTML = list.map(r => {
    const tags = [];
    if (r.status === 'Agendado' && r.horario) tags.push(`<span class="tag">${esc(r.horario)}</span>`);
    if (r.oportunidade) tags.push('<span class="tag opp">Oportunidade</span>');
    const w = quem(r);
    const sub = (r.status === 'Agendado' ? (shortDay(r.dataAgendada) || 'Sem data') : relDay(r.criadoEm)) + (w ? ' · ' + w : r.cidade ? ' · ' + r.cidade : '');
    return `<button class="row" data-act="go" data-h="#/registro/${r.id}"><span class="av">${esc((r.estabelecimento || '?').trim().charAt(0).toUpperCase())}</span>
      <span class="mid"><b>${esc(r.estabelecimento)}</b><small>${esc(sub)}</small>${tags.length ? `<span class="tags">${tags.join('')}</span>` : ''}</span>${pill(r.status)}</button>`;
  }).join('');
}

function vMeta() {
  const tk = todayKey();
  const vendas = REGS.filter(r => r.status === 'Vendido' && r.vendidoEm && dayKey(new Date(r.vendidoEm)) === tk).length;
  return `${topo('Meta de hoje', 'Vendas que você quer fechar hoje')}

      <div class="field"><span class="lab">Atalhos</span><div class="seg">${[3, 5, 8, 10].map(n => `<button class="chip${D.meta === n ? ' on' : ''}" data-act="metaSet" data-v="${n}">${n}</button>`).join('')}</div></div>

/* ====== Ações ====== */
function mostrarErro(id, t) { const el = document.getElementById(id); if (el) { el.textContent = t || el.textContent; el.hidden = false; el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
function lerDados() {
  return {
    estabelecimento: D.estabelecimento.trim().replace(/\s+/g, ' '), cidade: (D.cidade || '').trim(), atendeu: D.atendeu || '',
    contato: (D.contato || '').trim(), telefone: (D.telefone || '').trim(), email: (D.email || '').trim()
  };
}
async function criarVisita() {
  const x = lerDados();
  if (!x.estabelecimento) { mostrarErro('errNome'); document.getElementById('f-estabelecimento').focus(); return null; }
  const r = Object.assign({
    id: uid(), criadoEm: new Date().toISOString(), status: 'Aguardando resultado', oportunidade: false,
    dataAgendada: '', horario: '', falarCom: '', comentario: '', lat: null, lng: null, precisao: null, placas: '', valor: '', vendidoEm: ''
  }, x);
  const fresca = ultimaPos && (Date.now() - ultimaPos.timestamp) < 120000;
  if (fresca) aplicarPos(r, ultimaPos);
  await salvar(r);
  if (x.cidade) ls.set('ultimaCidade', x.cidade);
  if (!fresca) capturarLocal(r.id, false);
  return r;
}
function validarAgenda(errId) {
  if (!D.dataAgendada) { mostrarErro(errId, 'Escolha o dia da conversa.'); return false; }
  if (D.horaTipo === 'Hora' && !D.hora) { mostrarErro(errId, 'Escolha a hora ou marque Manhã/Tarde.'); return false; }
  return true;
}

const ACT = {
  go: el => go(el.dataset.h || el.getAttribute('href')),
  voltar: () => voltar(),
  inicio: () => inicio(),
  tabInicio: () => { if (ultimaRota !== '#/' && location.hash !== '') inicio(); },
  tabCadastro: () => { if (!(location.hash || '').startsWith('#/cadastro')) go('#/cadastro'); },
  olho: () => { oculto = !oculto; rerender(); },
  pend: () => { pendAberto = !pendAberto; rerender(); },
  set: el => { const f = el.dataset.f, v = el.dataset.v; D[f] = (el.dataset.toggle && D[f] === v) ? '' : v;
    if (f === 'status' && v === 'Agendado' && !D.dataAgendada) { D.dataAgendada = nextSaturdays(1)[0]; D.outra = false; }
    if (f === 'status' && v === 'Vendido') { if (!D.placas) D.placas = '1'; if (!D.valor) { D.valor = num2(PRECO_PLACA * (+D.placas || 1)); D.valorAuto = true; } }
    rerender(); },
  dia: el => { D.dataAgendada = el.dataset.v; D.outra = false; rerender(); },
  outra: () => { if (!D.outra && nextSaturdays(3).includes(D.dataAgendada)) D.dataAgendada = ''; D.outra = true; rerender(); const i = app.querySelector('input[type=date]'); if (i) { try { i.showPicker(); } catch (e) { i.focus(); } } },
  opp: () => { D.oportunidade = !D.oportunidade; rerender(); },
  filtro: el => { F.status = el.dataset.v; rerender(); },
  filtroOpp: () => { F.opp = !F.opp; rerender(); },
  metaMais: el => { D.meta = Math.max(1, Math.min(99, D.meta + (+el.dataset.v))); rerender(); },
  metaSet: el => { D.meta = +el.dataset.v; rerender(); },
  localAgora: el => { toast('Buscando localização…'); capturarLocal(el.dataset.id, true); },
  async salvarNova() { const r = await criarVisita(); if (r) { toast('Visita salva'); go('#/registro/' + r.id, true); } },
  async salvarNovaAgendar() { const r = await criarVisita(); if (r) go('#/agendar/' + r.id, true); },
  async salvarEdicao() {
    const x = lerDados(); if (!x.estabelecimento) { mostrarErro('errNome'); return; }
    const r = getReg(location.hash.split('/')[2]); Object.assign(r, x); await salvar(r);
    if (x.cidade) ls.set('ultimaCidade', x.cidade); toast('Dados salvos'); voltar();
  },
  async salvarAgenda() {
    if (!validarAgenda('errAg')) return;
    const r = getReg(location.hash.split('/')[2]);
    Object.assign(r, { status: 'Agendado', dataAgendada: D.dataAgendada, horario: horarioDoRascunho(), falarCom: (D.falarCom || '').trim() });
    if (r.vendidoEm) { r.vendidoEm = ''; r.placas = ''; r.valor = ''; }
    await salvar(r); toast('Agendado para ' + shortDay(r.dataAgendada)); voltar();
  },
  async salvarResultado() {
    const r = getReg(location.hash.split('/')[2]);
    if (D.status === 'Agendado' && !validarAgenda('errRes')) return;
    if (D.status === 'Vendido' && D.valor && parseNum(D.valor) === '') { mostrarErro('errRes', 'Valor inválido. Use, por exemplo, 49,90.'); return; }
    const antes = r.status;
    r.status = D.status; r.oportunidade = !!D.oportunidade; r.comentario = (D.comentario || '').trim();
    if (D.status === 'Agendado') { r.dataAgendada = D.dataAgendada; r.horario = horarioDoRascunho(); r.falarCom = (D.falarCom || '').trim(); }
    if (D.status === 'Vendido') { r.placas = parseNum(D.placas); r.valor = parseNum(D.valor); if (antes !== 'Vendido' || !r.vendidoEm) r.vendidoEm = new Date().toISOString(); }
    else { r.placas = ''; r.valor = ''; r.vendidoEm = ''; }
    await salvar(r); toast('Resultado salvo'); voltar();
  },
  async salvarMeta() {
    const m = { dia: todayKey(), meta: D.meta }; METAS[m.dia] = m.meta;
    try { await db.put('metas', m); } catch (e) { toast('Erro ao salvar a meta'); return; }
    toast('Meta de hoje: ' + m.meta); voltar();
  },
  exportar: () => exportarCSV()
};
const LIVE = {
  dup: el => {
    const box = document.getElementById('dup'); if (!box) return;
    const q = norm(el.value); const atual = location.hash.split('/')[2];
    const err = document.getElementById('errNome'); if (err && q) err.hidden = true;
    if (q.length < 3) { box.innerHTML = ''; return; }
    const m = REGS.filter(r => r.id !== atual && (norm(r.estabelecimento) === q || (q.length >= 4 && norm(r.estabelecimento).includes(q)))).slice(0, 3);
    box.innerHTML = m.length ? `<div class="dup">Já visitado: ${m.map(r => `<a href="#/registro/${r.id}" data-act="go">${esc(r.estabelecimento)}</a> (${esc(STATUS[r.status].curto)}, ${esc(relDay(r.criadoEm))})`).join(' · ')}</div>` : '';
  },
  placas: () => { if (D.valorAuto) { D.valor = num2(PRECO_PLACA * (+D.placas || 0)); const v = document.getElementById('f-valor'); if (v) v.value = D.valor; } },
  valor: () => { D.valorAuto = false; }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  e.preventDefault(); const fn = ACT[el.dataset.act]; if (fn) fn(el);
});
app.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'busca') { F.q = el.value; desenharLista(); return; }
  if (el.dataset.f) { D[el.dataset.f] = el.value; if (el.dataset.live && LIVE[el.dataset.live]) LIVE[el.dataset.live](el); }
});

/* ====== Exportar CSV (mesma ordem da aba Cadastro) ====== */
function exportarCSV() {
  if (!REGS.length) { toast('Nada para exportar ainda'); return; }
  const cab = ['Data e hora', 'Estabelecimento', 'Quem atendeu', 'Contato', 'Telefone', 'E-mail', 'Status', 'Categoria', 'Data agendada', 'Horário', 'Comentário', 'Latitude', 'Longitude', 'Link do mapa', 'Placas vendidas', 'Valor (R$)', 'Cidade', 'Falar com'];
  const dt = iso => { const d = new Date(iso); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + hhmm(d); };
  const dd = k => k ? k.split('-').reverse().join('/') : '';
  const cel = v => { v = String(v == null ? '' : v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const linhas = REGS.slice().sort((a, b) => a.criadoEm.localeCompare(b.criadoEm)).map(r => [
    dt(r.criadoEm), r.estabelecimento, r.atendeu, r.contato, r.telefone, r.email, r.status, r.oportunidade ? 'Oportunidade de serviço' : '',
    dd(r.dataAgendada), r.horario, r.comentario, r.lat ?? '', r.lng ?? '', r.lat != null ? `https://www.google.com/maps?q=${r.lat},${r.lng}` : '',
    r.placas, num2(r.valor), r.cidade, r.falarCom
  ].map(cel).join(';'));
  const csv = '﻿' + [cab.join(';'), ...linhas].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'cadastro-visitas-' + todayKey() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Planilha exportada');
}

/* ====== Início do app ====== */
(async function () {
  try {
    REGS = await db.all('registros');
    (await db.all('metas')).forEach(m => { METAS[m.dia] = m.meta; });
  } catch (e) {
    app.innerHTML = '<main><div class="empty">Não consegui abrir o banco de dados do celular. Saia do modo anônimo e tente de novo.</div></main>';
    return;
  }
  if (!history.state) history.replaceState({ d: 0 }, '', location.hash || '#/');
  route();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    let tinha = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (tinha) toast('App atualizado. Feche e abra de novo.'); tinha = true; });
  }
})();
